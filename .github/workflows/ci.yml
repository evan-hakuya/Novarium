name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # 版本取自 package.json 的 packageManager。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: External services are called from the server only
        run: |
          # grep 返回 1 表示没有匹配；0 是找到地址，2 是目录缺失等错误，都要失败。
          rc=0
          grep -rnE 'daosearch\.io|api\.cloudflare\.com|/ai/run/' apps/web/src packages/core/src || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::Call DaoSearch and Workers AI from apps/server only (CODING_STANDARDS.md); grep exit $rc."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只装 headless shell；runner 镜像自带 Chrome 所需的系统库，跳过 --with-deps 的 apt 安装（一次慢到 4 分半）。
      - run: pnpm --filter @novarium/web exec playwright install --only-shell chromium
      - run: pnpm --filter @novarium/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

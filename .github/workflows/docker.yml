name: Docker

# 把自部署镜像发布到 GHCR：main 的每次提交发布 latest 与 sha-<短哈希>，v* 标签发布对应版本号。
# PR 改动镜像内容时，amd64 与 arm64 各在原生 runner 上构建并启动容器做冒烟检查，不推送。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - apps/**
      - packages/**

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/novarium
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SMOKE_PASSWORD: smoke-test
    steps:
      - uses: actions/checkout@v7
      - run: uname -m
      - uses: docker/setup-buildx-action@v4
      # 原生平台构建，load 到本机后启动；load 不支持多平台，所以每个平台一个任务。
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: novarium:pr
          cache-from: type=gha
      - name: Smoke test the image
        run: |
          docker run -d --name novarium -p 8080:8080 -e OWNER_PASSWORD="$SMOKE_PASSWORD" novarium:pr
          for i in $(seq 30); do
            if curl -sf http://localhost:8080/api/health | grep -q '"ok":true'; then break; fi
            if [ "$i" -eq 30 ]; then echo "::error::/api/health did not become ok"; docker logs novarium; exit 1; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          [ "$code" = 200 ] || { echo "::error::/ returned $code, expected 200"; docker logs novarium; exit 1; }
          docker image inspect novarium:pr --format 'image arch: {{.Architecture}}'
          echo "health and web app OK"

services:
  novarium:
    # 发布在 GHCR 的镜像。想从源码构建时，把这一行换成 `build: .`。
    image: ghcr.io/evan-hakuya/novarium:latest
    ports:
      - "8080:8080"
    volumes:
      # 数据库、原稿、正文与封面都在 ./data 中，备份这个目录即可。
      - ./data:/data
    environment:
      # 所有者密码。在 compose.yaml 同目录的 .env 中设置 OWNER_PASSWORD=...
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      # 放在反向代理后面时改为 "true"，按 X-Forwarded-For 识别来源 IP。
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # 可选：Workers AI 的账户 ID 与 API 令牌，用于 AI 复核。不设置时后台不显示 AI 功能。
      WORKERS_AI_ACCOUNT_ID: ${WORKERS_AI_ACCOUNT_ID:-}
      WORKERS_AI_TOKEN: ${WORKERS_AI_TOKEN:-}
    restart: unless-stopped
